<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unfoldery</title>
<meta name="description" content="The hidden logic of everyday things. All Unfoldery channels in one place.">
<meta name="theme-color" content="#1A2BD8">
<meta property="og:title" content="Unfoldery">
<meta property="og:description" content="The hidden logic of everyday things.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unfoldery.github.io/">
<meta property="og:image" content="https://unfoldery.github.io/avatar.png">
<link rel="icon" href="znak.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --kobalt: #1A2BD8; --noc: #0D1470; --bijela: #FFFFFF;
    --magla: #DDE2FF; --limeta: #D8FF3E;
    --naslov: 'Archivo', system-ui, sans-serif;
    --tekst: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--kobalt); }
  body {
    min-height: 100dvh; background: var(--kobalt); color: var(--bijela);
    font-family: var(--tekst); font-weight: 500;
    display: flex; justify-content: center; overflow-x: hidden;
  }
  /* Trake sire iz tacke: pozadinski odjek znaka, bez teksta i bez limete. */
  .trake { position: fixed; left: 50%; bottom: 0; width: max(100vw, 900px); transform: translateX(-50%); z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 64px 16px 48px; display: flex; flex-direction: column; align-items: center; }
  .znak { width: 96px; height: auto; display: block; }
  h1 { font-family: var(--naslov); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -0.02em; margin-top: 20px; }
  .linija { color: var(--magla); font-size: 16px; line-height: 1.4; margin-top: 10px; text-align: center; }
  nav { width: 100%; margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
  nav a {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 60px; padding: 0 22px; border-radius: 16px;
    background: var(--bijela); color: var(--noc); text-decoration: none;
    font-family: var(--naslov); font-weight: 800; font-size: 19px; letter-spacing: -0.01em;
    transition: transform .15s cubic-bezier(.16,1,.3,1);
    animation: otvori .5s cubic-bezier(.16,1,.3,1) both;
  }
  nav a::after { content: "\2192"; font-family: var(--tekst); font-weight: 700; }
  nav a.glavni { background: var(--limeta); color: var(--noc); }
  /* Link bez adrese se ne prikazuje, pa se dodaje samo upisivanjem href-a. */
  nav a[href=""] { display: none; }
  nav a:nth-of-type(2) { animation-delay: .06s; }
  nav a:nth-of-type(3) { animation-delay: .12s; }
  nav a:nth-of-type(4) { animation-delay: .18s; }
  nav a:nth-of-type(5) { animation-delay: .24s; }
  nav a:hover { transform: translateY(-2px); }
  nav a:focus-visible { outline: 3px solid var(--limeta); outline-offset: 3px; }
  @keyframes otvori { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { nav a { animation: none; transition: none; } }
</style>
</head>
<body>
<svg class="trake" viewBox="0 0 900 450" fill="none" stroke="#0D1470" stroke-width="56" aria-hidden="true">
  <circle cx="450" cy="470" r="170"/><circle cx="450" cy="470" r="290"/><circle cx="450" cy="470" r="410"/>
</svg>
<main>
  <img class="znak" src="znak.svg" alt="">
  <h1>unfoldery</h1>
  <p class="linija">The hidden logic of everyday things.</p>
  <nav aria-label="Channels">
    <!-- Upisi adresu u href. Prazan href ostaje skriven. "glavni" je jedini istaknuti link. -->
    <a class="glavni" href="https://www.youtube.com/@Unfoldery" rel="me noopener">YouTube</a>
    <a href="https://www.instagram.com/theunfoldery/" rel="me noopener">Instagram</a>
    <a href="https://www.tiktok.com/@unfoldery" rel="me noopener">TikTok</a>
    <a href="https://www.facebook.com/profile.php?id=61595861776881" rel="me noopener">Facebook</a>
  </nav>
</main>
</body>
</html>
